return '<div class="stat-blocks">'+ids.map((id,i)=>statBlock(id,series[i],i)).join('')+'</div><div class="legend">'+legend+'</div><div class="charts">'+chart('Average by recorded match','Date is the recorded match start. Each point is one match; missing score sequences have no point.',dated.length?graphSvg('Three-dart average by recorded match start',trend):'<p class="empty">No recorded scores for this selection.</p>')+chart('Score distribution','Visits counted from the filtered score history.',graphSvg('Score visits by points range',histogram))+chart('Recorded leg outcomes','Won · other side won · unfinished. Matches without scores cannot supply leg outcomes.',graphSvg('Recorded leg outcomes',outcomes))+'</div><p class="note">Filters apply to the stat blocks, graphs and match ledger. Match start is the only available date; resumed-play timestamps and practice status are unknown.</p>'+(narrowed?'':'<details><summary>Stored configuration totals</summary>'+nativeTotals+'</details>')+'<h2 class="ledger-title">Match ledger</h2>';
}

function render(){const pid=Number(player.value),p=D.players.find(p=>p._id===pid),games=filteredGames(pid);
status.textContent=p.name+' · '+games.length+' matches · '+games.filter(g=>g.warnings.length).length+' incomplete / open · date/time ascending';
const compareId=Number(controls.compare.value),comparison=root.querySelector('[data-ledger="comparison"]');
{
const ids=controls.compare.value==='none'?[pid]:[...new Set([pid,compareId])],rows=[];for(const id of ids){const own=new Set(D.team.filter(t=>t.player_id===id).map(t=>t.opponent_id));let source=controls.opponent.value==='all'?D.stats:D.h2h.filter(s=>own.has(s.winner)&&s.loser===Number(controls.opponent.value));
source=source.filter(s=>own.has(s.opponent_id??s.winner)&&(points.value==='all'||s.start_points===Number(points.value))&&(controls.practice.value==='all'||s.practice===Number(controls.practice.value))&&(controls.in.value==='all'||s.in_type===Number(controls.in.value))&&interval(s.date_from,s.date_to)&&sideAllowed({members:D.team.filter(t=>t.opponent_id===(s.opponent_id??s.winner)).map(t=>t.player_id)}));for(const s of source)rows.push({id,s});}
const n=x=>x==null?'—':Number(x).toFixed(2);
comparison.innerHTML='<p>Stored configuration totals · date filters select overlapping intervals; totals are not prorated. Practice filters apply here; match records do not identify practice.</p><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Player / team</th><th>Points</th><th>Practice / in</th><th>Matches / won</th><th>Legs / won</th><th>3-dart avg</th><th>Checkout %</th><th>Best score / checkout</th></tr></thead><tbody>'+rows.map(({id,s})=>'<tr><td>'+esc(D.players.find(p=>p._id===id).name)+' · '+esc(name(s.opponent_id??s.winner))+'</td><td>'+(s.start_points===0?'Combined':s.start_points)+'</td><td>'+s.practice+' / '+s.in_type+'</td><td>'+s.matches_played+' / '+s.matches_won+'</td><td>'+s.legs_played+' / '+s.legs_won+'</td><td>'+n(s.darts_thrown?3*s.points_scored/s.darts_thrown:null)+'</td><td>'+n(s.checkout_attempts?100*s.checkouts_made/s.checkout_attempts:null)+'</td><td>'+s.best_score+' / '+s.best_checkout+'</td></tr>').join('')+'</tbody></table></div>';
}
const selectedIds=controls.compare.value==='none'?[pid]:[...new Set([pid,compareId])];
const nativeTotals=comparison.innerHTML;
const narrowed=controls.from.value||controls.to.value||controls.coverage.value!=='all';
comparison.innerHTML='<h2>Filtered recorded play</h2><p>Statistics below use the selected matches and their retained scores. Date filters use recorded match start; resumed-play dates are unknown. Team scores remain shared. Practice is unknown on match records; selecting a practice value excludes them.</p><div class="table-responsive"><table><thead><tr><th>Player</th><th>Matches</th><th>Incomplete / open</th><th>Recorded legs / won</th><th>Visits</th><th>Points</th><th>Darts</th><th>3-dart avg</th><th>Best score / checkout</th></tr></thead><tbody>'+selectedIds.map(filteredSummary).join('')+'</tbody></table></div>'+(narrowed?'<p>Stored lifetime totals are hidden because they cannot be split reliably by these match filters.</p>':'<details><summary>Stored configuration statistics</summary>'+nativeTotals+'</details>');

comparison.innerHTML=dashboard(selectedIds,nativeTotals,narrowed);
matches.innerHTML=games.map(g=>'<details><summary>'+esc(g.start_date)+' · '+g.startpoints+' · '+esc(g.sides.map(s=>name(s.id)).join(' vs '))+(g.warnings.length?' · ⚠':'')+'</summary><p>'+esc(g.warnings.length?g.warnings.join(' · '):'Recorded finish reached')+'</p><p class="text-small">Shared event: match-'+g._id+' · Recorded match start; resumed-play timestamps unavailable.</p>'+g.legsDerived.map(l=>'<details><summary>Set '+l.set+' · Leg '+l.legInSet+' · '+esc(l.winner?name(l.winner)+' won':'unfinished')+'</summary><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Visit</th><th>Player / team</th><th>Score</th><th>Left</th><th>Darts</th><th>Event</th></tr></thead><tbody>'+l.turns.map(t=>{const own=g.sides.find(s=>s.id===t.side)?.members.includes(pid);return '<tr><td>'+t.i+'</td><td>'+esc(name(t.side))+(own?' · selected':'')+'</td><td>'+t.score+(t.checkout?' · checkout':'')+'</td><td>'+t.remaining+'</td><td>'+t.darts+'</td><td class="text-small">match-'+g._id+'-score-'+t.i+'</td></tr>';}).join('')+'</tbody></table></div></details>').join('')+(!g.legsDerived.length?'<p>No score sequence retained.</p>':'')+'</details>').join('')||'<p>No retained matches for this selection.</p>';
}
for(const control of Object.values(controls))control.addEventListener('change',()=>{render();const selection=Object.fromEntries(Object.entries(controls).map(([k,e])=>[k,e.value]));window.openai?.setWidgetState?.({modelContent:selection,privateContent:selection}).catch(()=>{});});
function restore(s){if(!s)return;for(const [k,v] of Object.entries(s))if(controls[k])controls[k].value=v;render();}
render();restore(window.openai?.widgetState?.privateContent);window.addEventListener('openai:set_globals',e=>restore(e.detail?.globals?.widgetState?.privateContent));
})();
</script>
</body></html>
